# .orchestration/config.yaml
#
# Per-repo orchestration config. Copy this to `<repo>/.orchestration/config.yaml`
# and edit it for your project. The plugin's scripts, agents, and commands read
# this file so one harness works across codebases without a fork.
#
# Division of responsibility:
#   - THIS FILE declares the *mechanics*: branch model, gate commands, CI check
#     names, what triggers a security review, concurrency. Repo-specific facts.
#   - Your repo's CLAUDE.md / AGENTS.md hold the *knowledge*: conventions,
#     gotchas, the actual rules. The gate agents read those (see `rules_docs`).
#     Keep engineering rules out of this file; keep wiring out of those docs.
#
# "read by" annotations on each block:
#   shell  -> parsed by scripts/lib-config.sh (pure bash, no YAML dependency)
#   agent  -> read semantically by the orchestrator / gate agents from the YAML
#   both   -> read by shell for enforcement, and by agents for narration
#
# The legacy shell parser supports two shapes only: flat `key: value` scalars, and
# simple block lists / list-of-maps under a top-level key (see self_check).
# Do not introduce deeper nesting under a shell-read key.
#
# Lists may be block lists (`key:` then `  - item`) or flow lists. Flow lists may
# use Prettier's formatting: `key: [a, b]`, `key:` with `[a, b]` on the next more
# indented line, or `[` ... `]` wrapped across lines indented deeper than the key,
# with trailing commas and comments. Quote items containing `,` `[` `]` or ` #`.
# Still unsupported (validate-config refuses them with a hint): non-empty flow
# maps `{a: 1}`, nested flow lists, block scalars `|` / `>`, multi-line quoted or
# plain values, and text after a closing `]` (quote such a string instead).

# --- Schema version ------------------------------------------------------- both
# schema_version: 1 is the legacy ticket pipeline. Existing repositories keep
# their current behavior and do NOT adopt release-candidate states until they
# explicitly migrate to schema_version: 2.
schema_version: 1

# Optional minimum runtime release. Leave blank for portable scaffolding; set a
# release such as 1.5.2 when repository policy depends on newer safety fences.
minimum_orka_version: ""

# --- Orchestration worker threat model ---------------------------------- agent
# This governs only the boundary between an orchestration worker and its host.
# It never relaxes application security for users, tenants, remote clients,
# untrusted ticket text, or external services.
#
# cooperative-worker: workers may be wrong, crash, loop, overspend, or misuse an
# API accidentally, but are not assumed to deliberately defeat same-UID host
# controls. This is the portable default for ordinary repositories.
# isolated-worker: workers may be hostile. The design must use an independently
# owned boundary such as a separate UID/container and credential broker; a
# same-UID helper or repository file cannot satisfy this profile.
worker_trust_profile: cooperative-worker  # cooperative-worker | isolated-worker

# --- LLM execution routing ---------------------------------------------- agent
# Existing repositories remain on desktop execution unless they opt into API.
# Provider/model/effort are used only by API routes. A role inherits every
# unspecified global field and may override any field independently.
#
# `fallback: desktop` is deliberately narrow: use it only when an API request
# failed before receiving any provider/run id. A submitted, accepted, or
# uncertain request keeps its API reservation and must be reconciled; launching
# a desktop fallback then could duplicate writes, PRs, or billing.
llm:
  execution: desktop             # desktop | api
  # A model-less OpenAI desktop route selects Codex using its verified ChatGPT
  # subscription login and default model. Claude/API routes require a model id.
  provider: openai               # anthropic | openai | azure_adm | bedrock | bedrock_mantle
  model: ""                      # blank OpenAI desktop = subscription; otherwise required
  effort: ""                     # optional: low | medium | high | xhigh | max
  fallback: none                 # desktop | none; applies only to API launch
  # Hard ceilings are checked before every provider request. The runner reserves
  # the request's counted input plus its full output allowance, so concurrent
  # workers cannot race past a shared ticket or sprint limit. The ledger these
  # limits are counted against belongs to the repository, not to a lane's git
  # worktree, so N concurrent lanes share one ceiling instead of getting N.
  budgets:
    max_usd_per_run: 1.00
    warn_usd_per_ticket: 1.00     # event only; work continues
    pause_usd_per_ticket: 1.50    # hard operator-action stop; no same-user CLI bypass
    max_usd_per_ticket: 2.00
    max_usd_per_sprint: 20.00
    # Independent phase envelopes; all remain subject to the run/ticket/sprint
    # caps. Design and review phases may be raised to a $10 hard cap;
    # implementation cannot exceed $12. Run, ticket, sprint, and pause values
    # cannot exceed their compiled caps ($10/$30/$300/$20). Larger values are
    # clamped, and validate-config prints a WARNING for each. A root-owned host
    # budget policy (docs/sprint-controller.md) can raise these hard caps for
    # this repository; nothing in this file can.
    max_usd_per_design_phase: 5.00 # includes ticket scoping
    max_usd_per_implementation_phase: 12.00
    max_usd_per_code_review_phase: 5.00
    max_usd_per_security_review_phase: 5.00
    max_model_runs_per_ticket: 12 # non-design attempts, including rejected runs
    max_reviewer_runs_per_ticket: 6
    # Design reviews use max_design_rounds and do not consume this independent
    # code/security-review allowance. Completely released, nonexecuted requests
    # do not consume reviewer capacity; accepted or uncertain work still does.
    max_output_tokens_per_turn: 4096
    # Reviewer turns reserve this smaller output bound (never above the turn
    # cap). When the budget or max_tool_rounds ends a review's tool loop, one
    # tool-free final verdict turn with this output cap returns the verdict.
    max_output_tokens_per_review_turn: 8192
    final_verdict_output_tokens: 4096
    max_tool_rounds: 8
    max_tool_output_chars: 12000
    tool_timeout_seconds: 300
    # Complete non-streaming provider responses may legitimately take several
    # minutes for large contexts and high reasoning. This is independent from
    # tool_timeout_seconds and remains bounded by the worker supervisor.
    provider_read_timeout_seconds: 900
    max_pre_ack_retries: 2       # explicit overload rejections such as 529
    max_rate_limit_retries: 8    # known-not-accepted 429s; safe to resubmit
    max_rate_limit_wait_seconds: 600
    retry_backoff_seconds: 2
    retry_max_backoff_seconds: 60
  # Rates are USD per million tokens and are deliberately explicit: an unknown
  # model fails closed instead of being costed with a guessed price. Verify rates
  # when upgrading the plugin/model. These entries were checked 2026-08-26.
  pricing:
    claude-sonnet-5:
      input_per_mtok: 2.00
      cache_write_per_mtok: 2.50
      cache_read_per_mtok: 0.20
      output_per_mtok: 10.00
    gpt-5.6-sol:
      input_per_mtok: 4.00
      cache_write_per_mtok: 5.00
      cache_read_per_mtok: 0.40
      output_per_mtok: 20.00
      long_context_threshold_tokens: 272000
      long_context_input_multiplier: 2.00
      long_context_output_multiplier: 1.50
    # Bedrock route keys are inference-profile IDs. Verify the current AWS
    # Standard-tier rates before enabling these examples; pricing is explicit so
    # a model or routing-price change fails closed rather than weakening budgets.
    # global.anthropic.claude-sonnet-5:
    #   input_per_mtok: 2.00
    #   cache_write_per_mtok: 2.50
    #   cache_read_per_mtok: 0.20
    #   output_per_mtok: 10.00
    # Bedrock Mantle Standard-tier examples checked in us-east-1 on 2026-08-31.
    # These models do not currently report prompt-cache usage, so the cache
    # rates intentionally equal ordinary input for conservative budgeting.
    # zai.glm-5:
    #   input_per_mtok: 1.00
    #   cache_write_per_mtok: 1.00
    #   cache_read_per_mtok: 1.00
    #   output_per_mtok: 3.20
    # qwen.qwen3-coder-next:
    #   input_per_mtok: 0.50
    #   cache_write_per_mtok: 0.50
    #   cache_read_per_mtok: 0.50
    #   output_per_mtok: 1.20
    # moonshotai.kimi-k2.5:
    #   input_per_mtok: 0.60
    #   cache_write_per_mtok: 0.60
    #   cache_read_per_mtok: 0.60
    #   output_per_mtok: 3.00
    # moonshotai.kimi-k2-thinking:
    #   input_per_mtok: 0.60
    #   cache_write_per_mtok: 0.60
    #   cache_read_per_mtok: 0.60
    #   output_per_mtok: 2.50
  roles:
    # ticket-scoper:
    #   execution: api
    #   provider: openai
    #   model: gpt-5.6-sol
    #   effort: medium
    #   allowed_tools: [read_file, search, git_status]
    # implementer:
    #   execution: api
    #   provider: anthropic
    #   model: claude-sonnet-5
    #   effort: high
    #   fallback: desktop
    #   allowed_tools: [read_file, search, git_diff, git_status, run_check, apply_patch]
    # code-reviewer:
    #   execution: api
    #   provider: openai
    #   model: gpt-5.6-sol
    #   effort: medium
    #   allowed_tools: [read_file, search, git_diff, git_status, run_check]
    # sprint-worker:
    #   execution: api
    #   provider: azure_adm
    #   model: grok-4-6-eval     # Azure deployment name, not catalog model name
    #   allowed_tools: [read_file, search, git_diff, git_status, run_check, apply_patch]
    # design-reviewer:
    #   execution: api
    #   provider: bedrock
    #   model: global.anthropic.claude-opus-5
    #   effort: high
    #   allowed_tools: [read_file, search, git_diff, git_status, run_check]
    # code-reviewer:
    #   execution: api
    #   provider: bedrock_mantle
    #   model: moonshotai.kimi-k2-thinking
    #   allowed_tools: [read_file, search, git_diff, git_status, run_check]
    # security-reviewer:
    #   execution: desktop
    # visual-qa:
    #   execution: desktop        # API runner is text/code only; keep visual QA native

# --- Branch model --------------------------------------------------------- both
integration_branch: ""          # fill for schema v1, e.g. the branch feature work targets
production_branch: ""           # fill for schema v1, e.g. the protected release/history target

# Initial launch plus this many recovery launches are automatic. A later launch
# stops for operator action; a worker cannot self-approve a bypass. Root can
# grant one ticket a higher absolute attempt ceiling without changing this
# repository-wide default.
max_lane_relaunches: 2
# Productive time-limit continuations are tracked separately from failed
# relaunches and require a verified milestone in the attempt being resumed.
max_worker_continuations: 6
max_worker_idle_seconds: 1800
max_worker_lifetime_seconds: 14400

# --- Merge strategy per target -------------------------------------------- both
merge_to_integration: merge     # merge | squash. `merge` preserves per-PR history
merge_to_production: squash     # squash -> one clean commit per release

# --- CI required checks --------------------------------------------------- both
# Exact GitHub check-run names. Defines what "CI green" means on each target.
# The gate polls these before allowing merge-on-green.
ci_checks_integration:
  - TypeScript
  - Vitest
  - Build
ci_checks_production:
  - TypeScript
  - Vitest
  - Build
  - Playwright

# --- Self-check gate ------------------------------------------------------ both
# Runs in the implementer's worktree before it pushes, and again by the gate.
# Each entry is a named shell command; the gate reports pass/fail per name, so
# name them well. This is where a repo declares its own conventions (a hex-color
# grep, a lint rule, a codegen-drift check) WITHOUT the framework hardcoding them.
# A check passes on exit 0. Negate a "must find nothing" grep with `! grep ...`.
#
# `run` values are passed verbatim to `bash -c` (the parser strips only a pair of
# matching outer quotes; it does no YAML escape processing). Quote a value when it
# starts with `!` or contains a space-then-`#`. Prefer SINGLE quotes when the value
# needs literal backslashes: YAML single-quotes pass them through unchanged.
# Do not put an inline `# comment` after a `run:` value.
#
# Watch the exit codes: `! grep PATTERN path` reports success both when the
# pattern is absent AND when `path` is missing (grep exits 2), so a mistyped
# path silently passes. Point the check at a path you know exists.
self_check:
  - name: typecheck
    run: npx tsc --noEmit
  - name: build
    run: npm run build
  - name: unit
    run: npm test
  # Example repo-specific convention (delete if not applicable):
  # - name: no-hex-in-components
  #   run: '! grep -rqn "#[0-9a-fA-F]\{3,\}" src/components'

# Successful command output is discarded. On failure, gates emit only this many
# trailing lines into model context and retain the full 0600 log under
# .orchestration/.gate-logs for an explicit diagnostic check.
gate_log_lines: 80

# --- Heavy / optional verification --------------------------------------- agent
# Named headless pass/fail suites (e.g. the full e2e run). Opt-in: they assume a
# browser suite / running app. run-verification.sh <name> runs one and writes a
# sha-stamped result file the merge-guard validates. Each runs only on the target
# named in `when`.
#   when: never | integration | production | always
# Omit or leave empty for repos with no heavy suite.
verification:
  - name: e2e
    run: npx playwright test
    when: production          # release-gate only, by default
#
# Visual QA is a separate OPTIONAL agent stage (orchestration-visual-qa), not a
# verification entry -- it needs vision, not a pass/fail command. It runs
# run-visual-qa.sh, which reads BASE_URL and, for authed surfaces, AUTH=1 with
# VQA_EMAIL / VQA_PASSWORD and (if the login form differs) LOGIN_PATH and
# EMAIL_SELECTOR / PASSWORD_SELECTOR / SUBMIT_SELECTOR. Configure those via the
# environment when you invoke the stage; there is nothing to declare here.

# --- Gate sequence -------------------------------------------------------- agent
# Which independent review roles run, in order, before merge-on-green.
# Drop security-review for repos with no auth / data-isolation / payment surface.
gates:
  - code-review
  - security-review

# --- Design and repair bounds -------------------------------------------- agent
# Pre-code design iteration and post-code repair are different loops. Design may
# converge through several architecture revisions without wasting implementation;
# a repair that leaves agreed findings open is expensive and must fail fast.
#
# `max_design_rounds` counts pre-implementation design verdicts. Production code
# remains unauthorized until PASS. `max_repair_cycles` counts explicit repair
# reports, not reviewer passes; concurrent code and security reviews therefore
# consume one repair attempt together. Hitting either cap escalates, never merges.
# Round 1 sweeps the whole diff with full blocking authority; from round 2 the
# scope freezes, and only open ledger components, regressions in the delta, and
# security findings can block. That is what makes the blocking set shrink.
max_design_rounds: 5
max_repair_cycles: 2
review_ledger_dir: .orchestration/.review-ledger

# --- Security-gate trigger ------------------------------------------------ agent
# When the security gate is mandatory. Diff triggers accept the literal `always`
# or path fragments / keywords matched against the PR diff. Branch triggers use
# shell-style patterns and authoritative PR source/target metadata. Any match
# makes security review mandatory.
security_required_when:
  - migrations/
  - rls
  - auth
  - policy
  - SECURITY DEFINER
  - webhook
  - payment
# Example policy: ["hotfix/**"]
security_required_source_branches: []
# Example policy: ["main"]
security_required_target_branches: []

# --- Ticket system -------------------------------------------------------- agent
# How the orchestrator resolves and transitions work items.
ticket:
  kind: none                  # jira | github | none
  project: ""                 # optional tracker project/key; unused when kind=none
  # Jira adapters MUST pass this list as the API's `fields` parameter, then run
  # the response through scripts/context_pipeline.py sanitize-jira before any
  # ticket text enters model context. Omit jira_fields to use the same defaults.
  jira_fields:
    - key
    - summary
    - description
    - status
    - priority
    - components
    - subtasks
    - issuelinks

# --- Sprint orchestration ------------------------------------------------- agent
# Used by orchestrate-sprint when ticket.kind is jira. `active` is resolved to an
# exact Jira sprint id before checkpointing. For each dependency link type,
# blocked_side identifies the Jira API side occupied by the blocked ticket; the
# issue on the opposite side is its prerequisite. Adjust for your Jira scheme.
sprint_id: active
# Canonical credential trust anchor. This must be repository policy, never a
# caller-selected environment value. Credentials never go here: export them or
# set JIRA_API_TOKEN in the gitignored, chmod 600 .orchestration/.env of the
# shared repository root (add JIRA_EMAIL there too for Jira Cloud).
jira_base_url: ""
# Jira Cloud commonly exposes sprint identity through a custom field such as
# customfield_10020. Configure its exact REST field id here; the adapter derives
# the checkpoint sprint id/name from this provider field, never from a template.
jira_sprint_field: sprint
# Canonical provider priority names, most urgent first. Jira numeric priority
# ids are opaque record identifiers and are never used as ranks.
jira_priority_order:
  - Highest
  - High
  - Medium
  - Low
  - Lowest
sprint_dependency_links:
  - type: Blocks
    blocked_side: inward       # inward | outward; Jira default "is blocked by"
sprint_ready_statuses:
  - Ready
  - To Do
  - Open
  - Selected for Development
sprint_done_statuses:
  - Done
  - Closed
  - Resolved
sprint_blocked_statuses:
  - Blocked
sprint_checkpoint_dir: .orchestration/.sprint-state
# Opt-in bounded technical decomposition. When enabled, the controller scopes
# each otherwise-launchable ticket before reservation. Oversized tickets become
# a decomposition action rather than a user stop. Jira children are created
# only through the idempotent adapter and only when this repository policy opts in.
sprint_decomposition:
  auto_decompose_large_tickets: false
  complexity_threshold: 70
  max_auto_slices: 6
  jira_child_issue_type: Sub-task
  jira_subtask_decomposition_mode: sibling
  # Optional repository-defined contracts every generated slice must carry
  # before Jira creation or transition to Ready.
  required_slice_contracts: []
  # Optional ordered destination statuses when newly created children cannot
  # transition directly to a configured sprint_ready_status. Every step must
  # be available without missing required fields; the last item must be one of
  # the configured sprint_ready_statuses.
  # jira_ready_transition_path:
  #   - Scoping
  #   - Ready
# Reviewed product decisions are reusable scoping inputs. Keys are generic,
# stable identifiers emitted by the ticket scoper. Keep project-specific
# answers in the consuming repository, never in the reusable plugin. Omit the
# registry until a decision is approved; for example:
# sprint_decisions:
#   delivery.failure_policy:
#     status: approved
#     answer: Fail the isolated operation and preserve prior durable state.
#     rationale: Prevent partial cross-boundary updates.
# The independent local supervisor stops a lane that spends this much without
# verified progress. Repeated evidence does not reset this spending baseline.
# Other tickets continue within their own budgets.
max_usd_without_progress: 5.00
# Captain messages are event-driven so an interactive control session does not
# spend model tokens narrating unchanged polls. A compact heartbeat preserves
# visibility during long-running lanes; set to 0 to disable periodic heartbeats
# while retaining immediate event and user-action updates.
sprint_status_update_mode: event       # event | verbose
sprint_status_heartbeat_minutes: 30

# --- Concurrency ---------------------------------------------------------- both
# Max concurrent per-ticket sprint workflows and heavy verification chains. Drop
# to 1 under CI contention or when agents would collide on a shared test branch.
concurrency_max: 2
# Finish repair/recovery work first and pause fresh launches at this PR count.
max_unmerged_prs: 2
# Within otherwise-launchable work, finish preserved PRs before opening new work.
pr_drain_first: true
# Host-local heavy commands (builds, full test suites, browser suites) use this
# smaller admission limit even when more model lanes are active.
max_heavy_processes: 2

# --- Worktrees ------------------------------------------------------------ both
worktree_base: .claude/worktrees   # where isolated agent worktrees are created
# Cleanup is opt-in because hooks and lifecycle behavior vary by host. `manual`
# preserves every worktree until a human/agent explicitly removes it; `auto`
# allows the orchestrator and trusted Stop hook to remove clean, unlocked agent
# worktrees. Dirty or locked worktrees are always preserved.
worktree_cleanup: manual            # manual | auto

# --- Canonical rules docs ------------------------------------------------- agent
# The docs every gate agent must read before judging a diff. This is the seam
# that keeps project knowledge out of the harness.
rules_docs:
  - CLAUDE.md
  - AGENTS.md

