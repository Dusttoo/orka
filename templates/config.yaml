# Opt in only for cooperative workers that do not daemonize or escape sessions.
# Requires a normal supervisor cleanup receipt and an absent worker process group.
cooperative_auto_recovery: false
# Opt in to ticket-scoped recovery of an existing open PR only after Orka
# verifies its GitHub head, commit tree, clean worktree, and process quiescence.
preserved_pr_auto_recovery: false
